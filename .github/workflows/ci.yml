name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentflow_test?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentflow_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run tests with coverage
        env:
          EVALUATION_REPORT_DIR: ${{ runner.temp }}/evaluation-reports
        # Fail stuck packages with goroutine stacks before the job-level timeout.
        run: go test ./... -count=1 -timeout=3m -coverpkg=./... -covermode=atomic -coverprofile=coverage.out

      - name: Retain offline evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-evaluation-reports
          path: ${{ runner.temp }}/evaluation-reports
          retention-days: 14
          if-no-files-found: warn

      - name: Upload backend coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: apps/api/coverage.out
          flags: backend
          name: backend
          fail_ci_if_error: true
          token: ${{ env.CODECOV_TOKEN }}

      - name: Reject test fixtures in server dependencies
        run: |
          dependencies="$(go list -deps ./cmd/server)"
          if printf '%s\n' "$dependencies" | grep -q '/internal/testsupport/'; then
            echo "Server must not depend on test/evaluation fixtures"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Check generated Go API contract
        run: |
          go generate ./internal/apicontract
          git diff --exit-code -- internal/apicontract/types.gen.go

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check generated TypeScript API contract
        run: npm run contract:check

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

  functional-browser:
    name: Browser to Go / Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agentflow_test?sslmode=disable
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentflow_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run cross-layer functional gates
        run: npm run test:e2e
      - name: Retain functional evidence and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-browser-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run OIDC identity and resource authorization gate
        env:
          AGENTFLOW_IDENTITY_TEST: '1'
        run: npm run test:e2e -- identity.spec.ts resource-authorization.spec.ts workspace-agent-config.spec.ts agent-selection.spec.ts
      - name: Retain identity boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: identity-membership-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run execution boundary gate
        env:
          AGENTFLOW_EXECUTION_BOUNDARY_TEST: '1'
        run: npm run test:e2e -- execution-boundaries.spec.ts
      - name: Retain execution boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-boundary-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run sandbox command composition and receipt gate
        env:
          AGENTFLOW_SANDBOX_BROWSER_TEST: '1'
        run: npm run test:e2e -- sandbox-command.spec.ts tool-progress.spec.ts run-inbox.spec.ts
      - name: Retain sandbox command evidence (controlled CLI, not VM isolation)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-command-composition-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run inbox compaction and budget boundary gate
        env:
          AGENTFLOW_INBOX_EDGE_TEST: '1'
        run: npm run test:e2e -- run-inbox-boundaries.spec.ts
      - name: Retain durable inbox boundary evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: durable-inbox-boundary-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run owner-scoped model admission gate
        env:
          AGENTFLOW_OWNER_ADMISSION_TEST: '1'
          AGENTFLOW_IDENTITY_TEST: '1'
        run: npm run test:e2e -- owner-admission.spec.ts
      - name: Retain owner admission evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owner-model-admission-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run usage breakdown and cache cost gate
        env:
          AGENTFLOW_USAGE_TEST: '1'
        run: npm run test:e2e -- usage-breakdown.spec.ts
      - name: Retain usage breakdown evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usage-breakdown-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run provider reasoning and partial output recovery gate
        env:
          AGENTFLOW_REASONING_TEST: '1'
        run: npm run test:e2e -- reasoning.spec.ts partial-output.spec.ts
      - name: Retain provider reasoning evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: provider-reasoning-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn

      - name: Run themed Keycloak registration and onboarding gate
        run: bash ../../scripts/test-keycloak-auth.sh
      - name: Retain Workspace onboarding evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-onboarding-evidence
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 14
          if-no-files-found: warn
