name: agentflow-observability
services:
  collector:
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger
    mem_limit: 192m
    cpus: 0.5
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
    mem_limit: 256m
    cpus: 0.5
