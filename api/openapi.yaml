openapi: 3.1.0
info:
  title: AgentFlow API
  version: 0.1.0
  description: |
    Authoritative HTTP contract shared by generated Go DTOs and the typed
    TypeScript client. Business handlers remain implemented with net/http.
    With AUTH_MODE=oidc, every business operation requires a revocable session
    cookie and owned/granted Workspace entity (401/404 on failure). Mutations also
    require the configured frontend Origin. Health/authentication and preflight
    are exempt. Local mode is unauthenticated trusted development, not an
    alternate authentication mechanism. HTTPS uses __Host-agentflow_session;
    loopback HTTP uses agentflow_session. Archived business writes return 409;
    missing scope resolves to the owner's active default. Workspace management
    is owner-scoped independently of the selected header. Workspace Agent
    configuration and Tool availability writes are owner-scoped; catalog reload
    and global Tool security policy remain trusted-local operator operations.
    Resource IDs are resolved inside that authorized Workspace; foreign IDs return
    404. SSE delivery rechecks the session and Workspace on each write, including
    Chat/Continue/Resume. A later access failure emits an error frame using the
    existing ChatStreamEvent error contract and stops delivery, without canceling
    the admitted durable Run. See the resource authorization guide.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Chat
  - name: Conversations
  - name: Agents
  - name: Runs
  - name: Tools
  - name: Workspaces
  - name: Knowledge

paths:
  /api/project-guidance/projects:
    get:
      operationId: listProjectGuidanceProjects
      tags: [Chat]
      description: List operator-trusted projects with current read-only root access in the authorized Workspace. Returns logical names and rule counts, not host paths or file bodies.
      responses:
        '200':
          description: Empty projects when disabled or no authorized projects remain.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectGuidanceCatalog' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/project-guidance/projects/{root}/files:
    get:
      operationId: listProjectGuidanceFiles
      tags: [Chat]
      description: Browse at most 500 entries in one authorized project directory. Linked, sensitive and unsafe files are omitted. This supplies selection metadata, not instruction trust or Tool grants.
      parameters:
        - { in: path, name: root, required: true, schema: { type: string } }
        - { in: query, name: path, schema: { type: string, default: '.' } }
      responses:
        '200':
          description: Relative file/directory entries with an explicit truncation flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectFilePage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { description: Project guidance discovery is not configured. }
  /api/rag/evaluations/run:
    post:
      operationId: runRAGEvaluation
      tags: [Knowledge]
      description: Evaluate a Golden Dataset or legacy cases inside the authorized Workspace. All case constraints are validated before retrieval. Case constraints intersect request constraints; conflicting legacy keys, invalid filters and missing required constraints return 400, never unfiltered results. This is retrieval/Context regression, not answer generation or Document ACL evaluation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RAGEvaluationRunRequest' }
      responses:
        '200':
          description: Case results and pipeline identity. Each case includes evidence of effective constraints, matched sources, selected Context revisions, estimated Context tokens and latency. An upstream failure aborts this HTTP batch; the offline runner retains failed/not-evaluated samples.
          content:
            application/json:
              schema:
                type: object
                required: [summary, cases]
                properties:
                  summary: { type: object, additionalProperties: true }
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        evidence: { $ref: '#/components/schemas/RAGEvaluationEvidence' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { description: Embedding or ranking dependency failed; no success metrics returned. }
  /api/rag/search:
    post:
      operationId: searchKnowledge
      tags: [Knowledge]
      description: Search inside the authorized Workspace. Legacy metadata and typed metadata_filter are ANDed before semantic/keyword limits and context expansion. User OR never encloses Workspace or schema eligibility. Typed filtering does not implement ACL or expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KnowledgeSearchRequest' }
      responses:
        '200':
          description: Existing retrieval response with items, context_items, citation_sources and pipeline metadata. A valid filter with no eligible candidates returns an empty items array and no_match.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500':
          description: A recall adapter violated candidate eligibility; no partial sources are returned.
  /api/documents/metadata-schema:
    get:
      operationId: getDocumentMetadataSchema
      tags: [Knowledge]
      description: Read the current versioned field contract. Ownership identifies permitted declaration, not verified truth. Unknown extensions have no typed-filter or authorization meaning.
      responses:
        '200':
          description: Current immutable metadata schema; legacy documents remain unversioned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentMetadataSchema' }
  /api/documents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: getKnowledgeDocument
      tags: [Knowledge]
      responses:
        '200':
          description: Scoped document detail, source chunks and the current schema for inspection. Each Chunk uses its owning Document's stored schema version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocumentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/documents:
    post:
      operationId: ingestDocument
      tags: [Knowledge]
      description: Ingest and index a document. Same-source/body custom metadata changes require expected_updated_at and reuse the conditional metadata update without embedding calls. An explicit token is not accepted for content/index replacement; use normal ingestion for reindexing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentIngestRequest' }
      responses:
        '201':
          description: Created, reindexed, or conditionally metadata-updated Document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/documents/{id}/metadata:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    patch:
      operationId: updateDocumentMetadata
      tags: [Knowledge]
      description: Replace custom metadata in the authorized Workspace, atomically updating inherited Chunk fields without re-embedding. expected_updated_at is the existing Document timestamp used as an optimistic concurrency token. Identical payload retries are no-ops even with an older nonzero token; different stale updates return 409. Derived/source/indexing fields cannot be changed here. Does not enforce business expiry or Document ACLs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentMetadataUpdate' }
      responses:
        '200':
          description: Updated Document, or unchanged Document for an identical retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KnowledgeDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/conversations/{id}/inputs:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      operationId: listRunInputs
      tags: [Conversations]
      description: Owner-scoped durable input receipts. Queued inputs expire after 24 hours; receipts are retained for seven days, longer for recoverable Runs.
      responses:
        '200':
          description: Input receipts in submission order.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/RunInput' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: enqueueRunInput
      tags: [Conversations]
      description: Explicit steer or follow_up. Owner derives from authentication. Reusing an idempotency key with changed content returns 409. Steer never modifies frozen policy; follow-up uses a fresh Run. Limits are 8 KiB per input, 16 pending inputs, 64 KiB pending bytes, 64 KiB steering per Run and 256 retained receipts per Conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInputRequest' }
      responses:
        '202':
          description: Durable receipt; applied does not mean model compliance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInput' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/BadRequest' }
  /api/conversations/{id}/inputs/{inputID}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
      - { in: path, name: inputID, required: true, schema: { type: string } }
    delete:
      operationId: withdrawRunInput
      tags: [Conversations]
      description: Withdraw a queued input; applied inputs return 409. Repeated withdrawal is idempotent.
      responses:
        '200':
          description: Withdrawn receipt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInput' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadRequest' }
  /api/conversations/{id}/inputs/start:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: startFollowup
      tags: [Conversations]
      description: Explicitly retry the oldest pending follow-up after completed, failed or canceled execution. Active, waiting and recoverable Runs must be resolved first. Admission is bounded; execution can still fail preparation and leave the receipt queued.
      responses:
        '202':
          description: Dispatcher admitted; consult the durable receipt for Run creation.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { type: string } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/BadRequest' }
  /api/workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      description: Lists only the current user's owned, granted, non-deleted Workspaces, including archived read-only spaces. Local mode uses a persistent server-owned local User. Selected Workspace headers do not scope this endpoint.
      responses:
        '200':
          description: Owned Workspaces.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Workspace' }
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      description: Owner is derived from the session, never accepted from the client. IDs are generated by PostgreSQL; names do not identify resources.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceCreateRequest' }
      responses:
        '201':
          description: Created Workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/workspaces/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, pattern: '^[1-9][0-9]*$' }
    get:
      operationId: getWorkspace
      tags: [Workspaces]
      responses:
        '200':
          description: Owned and granted Workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWorkspace
      tags: [Workspaces]
      description: Renames, updates description, archives/restores or selects the default. Closing the current default requires an owned active replacement. Unfinished Runs and uncertain effects block archive/delete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceUpdateRequest' }
      responses:
        '200':
          description: Updated Workspace, preserving its ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Last active space, invalid replacement default, unfinished Run or uncertain effect prevents the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: deleteWorkspace
      tags: [Workspaces]
      description: Sets deleted_at. Does not physically erase resource data. Deleted spaces cannot be accessed or implicitly recreated at login.
      parameters:
        - in: query
          name: replacement_workspace_id
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses:
        '204': { description: Soft-deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Workspace cannot currently be deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/session:
    get:
      operationId: getIdentitySession
      tags: [System]
      description: |
        Public session probe. OIDC identity is verified from a revocable cookie;
        local mode is explicitly unauthenticated trusted development. Memberships
        are database-owned, automatically provisioned for a personal Workspace after
        verified login; never supplied by the browser or inferred from email.
      responses:
        '200':
          description: Current authentication mode, identity and Workspace memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySession'
        '503':
          description: Identity persistence unavailable; no local-mode fallback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    get:
      operationId: startLogin
      tags: [System]
      responses:
        '302':
          description: OIDC authorization redirect with state, nonce, S256 PKCE and prompt=login to require fresh authentication.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/auth/register:
    get:
      operationId: startRegistration
      tags: [System]
      description: |
        OIDC authorization redirect with prompt=create, state, nonce and S256
        PKCE. Available in OIDC mode; a supporting IdP (Keycloak) controls whether
        account creation is allowed. Verified login always provisions a personal Workspace.
        The IdP receives passwords and owns account creation, policies and MFA.
      responses:
        '302':
          description: Redirect to the IdP registration screen.
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Cannot persist the authorization attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/callback:
    get:
      operationId: completeLogin
      tags: [System]
      parameters:
        - in: query
          name: code
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
      responses:
        '303':
          description: Verified OIDC login ensures an idempotent personal Workspace before creating a host-only HttpOnly session and redirecting to the workbench. Revoked Memberships are not restored.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid identity token or nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Identity persistence or personal Workspace provisioning failed; no session is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/logout:
    post:
      operationId: signOut
      tags: [System]
      description: Revoke the local session and clear its cookie regardless of remaining TTL; requires configured frontend Origin. The next explicit sign-in requests provider reauthentication. Does not end provider SSO or sessions on other devices. Closing a tab does not call this endpoint.
      responses:
        '204':
          description: Local session revoked.
        '403':
          description: Mutation Origin rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: API process health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      responses:
        '200':
          description: Conversations visible in the current workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      operationId: updateConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteConversation
      tags: [Conversations]
      responses:
        '200':
          description: Conversation deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listMessages
      tags: [Conversations]
      responses:
        '200':
          description: Conversation messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chat:
    post:
      operationId: streamChat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-sent stream of ChatStreamEvent values.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/skills:
    get:
      operationId: listSkills
      tags: [Agents]
      responses:
        '200':
          description: Operator-trusted Skill metadata, without directory paths or contents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SkillMetadata'

  /api/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        '200':
          description: Active agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
      responses:
        '201':
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getAgent
      tags: [Agents]
      responses:
        '200':
          description: Agent configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
      responses:
        '200':
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveAgent
      tags: [Agents]
      responses:
        '204':
          description: Agent archived.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs:
    get:
      operationId: listRuns
      tags: [Runs]
      responses:
        '200':
          description: Runs ordered by the store.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/attention:
    get:
      operationId: listRunAttention
      tags: [Runs]
      responses:
        '200':
          description: Highest-priority operator attention item for each actionable Run.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperatorAttentionItem'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [Runs]
      responses:
        '200':
          description: Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/clarifications:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listClarifications
      tags: [Runs]
      responses:
        '200':
          description: Questions and durable answer/application receipts for this authorized Run.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clarification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/clarifications/{question_id}/answers:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: question_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: answerClarification
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationAnswerRequest'
      responses:
        '200':
          description: Durable clarification receipt. Internal protocol checkpoints are never exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/clarifications/{question_id}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: question_id
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: resumeClarification
      tags: [Runs]
      description: Admit and resume the original Run using the durable answer and frozen protocol. Does not create a Run or reset its budget.
      responses:
        '200':
          description: Unified Run SSE stream.
          content:
            text/event-stream:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: Run execution capacity temporarily unavailable. Retry after the indicated delay.
          headers:
            Retry-After:
              schema: {type: integer, minimum: 0}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/clarifications/{question_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
      - name: question_id
