      properties:
        id: { type: string }
        schema_version: { type: integer }
        run_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        tool_call_id: { type: string }
        tool_name: { type: string }
        definition_revision: { type: string }
        media_type: { type: string }
        content_hash: { type: string }
        original_byte_size: { type: integer }
        stored_byte_size: { type: integer }
        redacted: { type: boolean }
        redaction_strategy: { type: string }
        redaction_count: { type: integer }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
    ToolEffectReconciliationAction: { type: string, enum: [confirm_committed, confirm_failed, retry_with_same_key, compensate] }
    ToolEffect:
      type: object
      required: [idempotency_key, version, run_id, stage_id, tool_call_id, tool_name, request_hash, status, has_result, created_at, updated_at]
      properties:
        idempotency_key: { type: string }
        version: { type: integer, format: int64 }
        run_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        tool_call_id: { type: string }
        tool_name: { type: string }
        definition_revision: { type: string }
        request_hash: { type: string }
        status: { type: string }
        has_result: { type: boolean }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        available_actions: { type: [array, 'null'], items: { $ref: '#/components/schemas/ToolEffectReconciliationAction' } }
    ToolEffectList:
      type: object
      required: [run_id, effects]
      properties:
        run_id: { type: string }
        effects: { type: array, items: { $ref: '#/components/schemas/ToolEffect' } }
    ToolEffectReconciliationCommand:
      type: object
      additionalProperties: false
      required: [command_id, action, expected_version, actor, reason]
      properties:
        command_id: { type: string }
        action: { $ref: '#/components/schemas/ToolEffectReconciliationAction' }
        expected_version: { type: integer, format: int64 }
        actor: { type: string }
        reason: { type: string }
        result: {}
    ToolEffectReconciliationOutcome:
      type: object
      required: [command_id, applied, outcome, effect]
      properties:
        command_id: { type: string }
        applied: { type: boolean }
        outcome: { type: string }
        effect: { $ref: '#/components/schemas/ToolEffect' }
    StageCheckpoint:
      type: object
      required: [id, provider, run_id, conversation_id, stage_id, status, input_hash, runtime_snapshot_hash, tool_definitions_hash, event_cursor, created_at, updated_at]
      properties:
        id: { type: string }
        provider: { type: string }
        run_id: { type: string }
        conversation_id: { type: string }
        stage_id: { type: string }
        status: { type: string }
        input_hash: { type: string }
        output_hash: { type: string }
        runtime_snapshot_hash: { type: string }
        tool_definitions_hash: { type: string }
        event_cursor: { type: integer, format: int64 }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModelRequestEnvelope:
      type: object
      required: [id, run_id, conversation_id, model_call_id, attempt, operation, provider, model, runtime_snapshot_hash, payload_hash, payload_bytes, parameters, source_token_breakdown, message_count, tool_count, created_at]
      properties:
        id: { type: string }
        run_id: { type: string }
        conversation_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        model_call_id: { type: string }
        attempt: { type: integer }
        operation: { type: string }
        provider: { type: string }
        model: { type: string }
        context_manifest_id: { type: string }
        runtime_snapshot_hash: { type: string }
        payload_hash: { type: string }
        payload_bytes: { type: integer }
        parameters: { type: [object, 'null'], additionalProperties: true }
        source_token_breakdown: { type: [object, 'null'], additionalProperties: { type: integer } }
        message_count: { type: integer }
        tool_count: { type: integer }
        created_at: { type: string, format: date-time }
    ModelRequestCapture:
      type: object
      required: [mode, original_bytes, stored_bytes, redacted, redaction_count, truncated, reconstructable, expired]
      properties:
        mode: { type: string, enum: [metadata_only, redacted, full] }
        content: { type: string }
        content_hash: { type: string }
        original_bytes: { type: integer }
        stored_bytes: { type: integer }
        redacted: { type: boolean }
        redaction_strategy: { type: string }
        redaction_count: { type: integer }
        truncated: { type: boolean }
        reconstructable: { type: boolean }
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
    ModelRequestSourceDiff:
      type: object
      required: [envelope_selected_tokens, manifest_selected_tokens, manifest_excluded_tokens, matches_envelope]
      properties:
        envelope_selected_tokens: { type: object, additionalProperties: { type: integer } }
        manifest_selected_tokens: { type: object, additionalProperties: { type: integer } }
        manifest_excluded_tokens: { type: object, additionalProperties: { type: integer } }
        matches_envelope: { type: boolean }
    ModelRequestDebugRecord:
      type: object
      required: [envelope, capture, source_diff]
      properties:
        envelope: { $ref: '#/components/schemas/ModelRequestEnvelope' }
        capture: { $ref: '#/components/schemas/ModelRequestCapture' }
        manifest: { type: object, additionalProperties: true, description: Context Manifest metadata, not raw model input. }
        source_diff: { $ref: '#/components/schemas/ModelRequestSourceDiff' }
    ModelRequestDebugResponse:
      type: object
      required: [run_id, reconstructability_status, records]
      properties:
        run_id: { type: string }
        reconstructability_status: { type: string, enum: [valid, invalid] }
        invariant_error: { type: string }
        records: { type: array, items: { $ref: '#/components/schemas/ModelRequestDebugRecord' } }
    EpisodeRetrievals:
      type: object
      required: [event_count, memories, chunks]
      properties:
        event_count: { type: integer }
        memories: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
        chunks: { type: [array, 'null'], items: { type: object, additionalProperties: true } }
    EpisodeLLMCall:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string }
        step_id: { type: string }
        role: { type: string }
        agent_id: { type: string }
        model: { type: string }
        framework: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        token_usage_estimated: { type: boolean }
        output_chars: { type: integer }
        duration_ms: { type: integer, format: int64 }
    EpisodeToolCall:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string }
        step_id: { type: string }
        tool_name: { type: string }
        tool_call_id: { type: string }
        error: { type: string }
        duration_ms: { type: integer, format: int64 }
    EpisodeError:
      type: object
      required: [source, message]
      properties:
        source: { type: string }
        event_id: { type: string }
        step_id: { type: string }
        kind: { type: string }
        category: { type: string }
        retryable: { type: boolean }
        message: { type: string }
    EpisodeVerification:
      type: object
      required: [status, evidence, warnings, records, artifacts]
      properties:
        status: { type: string }
        subject_hash: { type: string }
        contract: { type: object, additionalProperties: true }
        evidence: { type: [array, 'null'], items: { type: string } }
        warnings: { type: [array, 'null'], items: { type: string } }
        records: { type: [array, 'null'], items: { $ref: '#/components/schemas/VerificationEvidence' } }
        artifacts: { type: [array, 'null'], items: { $ref: '#/components/schemas/VerificationArtifact' } }
    EpisodeReport:
      type: object
      required: [run, conversation, agent, task, final_output, messages, steps, trace_summary, retrievals, llm_calls, tool_calls, errors, verification]
      properties:
        run: { $ref: '#/components/schemas/Run' }
        conversation: { $ref: '#/components/schemas/Conversation' }
        agent: { $ref: '#/components/schemas/Agent' }
        task: { type: string }
        final_output: { type: string }
        messages: { type: [array, 'null'], items: { $ref: '#/components/schemas/Message' } }
        steps: { type: [array, 'null'], items: { $ref: '#/components/schemas/CollaborationStep' } }
        trace_summary: { $ref: '#/components/schemas/RunTraceSummary' }
        retrievals: { $ref: '#/components/schemas/EpisodeRetrievals' }
        llm_calls: { type: [array, 'null'], items: { $ref: '#/components/schemas/EpisodeLLMCall' } }
        tool_calls: { type: [array, 'null'], items: { $ref: '#/components/schemas/EpisodeToolCall' } }
        errors: { type: [array, 'null'], items: { $ref: '#/components/schemas/EpisodeError' } }
        verification: { $ref: '#/components/schemas/EpisodeVerification' }
    RunReplay:
      type: object
      required: [run, projection, conversation, messages, steps, summary, usage_ledger, run_events, stage_checkpoints, tool_effects, tool_artifacts, verification_evidence, verification_artifacts, task_state_revisions]
      properties:
        plan: { $ref: '#/components/schemas/RunPlan' }
        run:
          $ref: '#/components/schemas/Run'
        projection:
          $ref: '#/components/schemas/RunProjectionSnapshot'
        runtime_snapshot:
          type: object
          additionalProperties: true
          properties:
            project_guidance: { $ref: '#/components/schemas/ProjectGuidanceSnapshot' }
            knowledge_scope: { $ref: '#/components/schemas/KnowledgeScope' }
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Message'
        steps:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/CollaborationStep'
        summary:
          $ref: '#/components/schemas/RunTraceSummary'
        usage_ledger:
          $ref: '#/components/schemas/RunUsageLedger'
        run_events:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RunEvent'
        stage_checkpoints:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/StageCheckpoint'
        tool_effects:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ToolEffect'
        tool_artifacts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/ToolArtifact'
        verification_evidence:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/VerificationEvidence'
        verification_artifacts:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/VerificationArtifact'
        task_state_revisions:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/TaskStateRevision'
        recovery_summary:
          $ref: '#/components/schemas/RecoverySummary'
        structured_result:
          $ref: '#/components/schemas/StructuredRunResult'
    VerificationDecision:
      type: object
      required: [status, allow_completion, attempt, subject_hash, run_status, summary]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        allow_completion: { type: boolean }
        attempt: { type: integer }
        subject_hash: { type: string }
        run_status:
          $ref: '#/components/schemas/RunStatus'
        summary: { type: string }
    VerifyRunResponse:
      type: object
      required: [run, decision]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        decision:
          $ref: '#/components/schemas/VerificationDecision'

    ConversationChunk:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: conversation
        conversation_id: { type: string }
    RunStateChunk:
      type: object
      required: [type, conversation_id, run_id, agent_id, status]
      properties:
        type:
          type: string
          const: run_state
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        status:
          $ref: '#/components/schemas/RunStatus'
    RunProgressChunk:
      type: object
      required: [type, conversation_id, run_id]
      properties:
        type:
          type: string
          const: run_progress
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        iteration: { type: integer }
        max_iterations: { type: integer }
        elapsed_seconds: { type: integer }
        max_runtime_seconds: { type: integer }
        output_chars: { type: integer }
        max_output_chars: { type: integer }
        tool_calls: { type: integer }
        max_tool_calls: { type: integer }
        stop_reason: { type: string }
    ModelDeltaChunk:
      type: object
      required: [type, delta]
      properties:
        type:
          type: string
          const: model_delta
        delta: { type: string }
        reset:
          type: boolean
          description: Clear the current assistant draft before appending delta; retracts provisional text when a streamed round chooses tools.
    MessageReasoning:
      type: object
      required: [run_id, turn_id, model_call_id, format, status]
      properties:
        run_id: { type: string }
        turn_id: { type: string }
        stage_id: { type: string }
        model_call_id: { type: string }
        format: { type: string, enum: [deepseek_reasoning_content] }
        status: { type: string, const: complete }
        text: { type: string, description: Redacted plain text, at most 16 KiB UTF-8. }
        truncated: { type: boolean }
    ModelReasoningChunk:
      type: object
      description: Sanitized provider output, never an answer or private continuation. Completed text is durable; live text replaces this call's display copy.
      required: [type, run_id, turn_id, model_call_id, format, status]
      properties:
        type: { type: string, const: model_reasoning }
        run_id: { type: string }
        turn_id: { type: string }
        stage_id: { type: string }
        model_call_id: { type: string }
        format: { type: string, enum: [deepseek_reasoning_content] }
        status: { type: string, enum: [receiving, complete, interrupted] }
        text:
          type: string
          description: Redacted plain-text replacement, at most 16 KiB UTF-8. Receiving text is an ephemeral safe prefix; complete text is durable. Interrupted events contain no text.
        truncated: { type: boolean }
    StageStateChunk:
      type: object
      required: [type, conversation_id, run_id, role, status]
      properties:
        type:
          type: string
          const: stage_state
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        role: { type: string }
        status: { type: string }
        iteration: { type: integer }
        input: { type: string }
        output: { type: string }
        error: { type: string }
    DoneChunk:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: done
        conversation_id: { type: string }
        title: { type: string }
        message_id: { type: string }
        result_url: { type: string, description: Authorized structured result endpoint; no provisional object is included in SSE. }
        run_id: { type: string }
        agent_id: { type: string }
        status:
          $ref: '#/components/schemas/RunStatus'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RAGCitation'
        invalid_citation_ids:
          type: array
          items: { type: string }
        web_citations:
          type: array
          items:
            $ref: '#/components/schemas/WebCitation'
        invalid_web_citation_ids:
          type: array
          items: { type: string }
    ErrorChunk:
      type: object
      required: [type, error]
      properties:
        type:
          type: string
          const: error
        error: { type: string }
        code: { type: string }
        source: { type: string }
        category: { type: string }
        retryable: { type: boolean }
        retry_after_ms: { type: integer, format: int64, minimum: 0 }
        request_id: { type: string }
    ChatStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/ConversationChunk'
        - $ref: '#/components/schemas/RunStateChunk'
        - $ref: '#/components/schemas/RunProgressChunk'
        - $ref: '#/components/schemas/ModelDeltaChunk'
        - $ref: '#/components/schemas/ModelReasoningChunk'
        - $ref: '#/components/schemas/ToolProgressChunk'
        - $ref: '#/components/schemas/StageStateChunk'
        - $ref: '#/components/schemas/DoneChunk'
        - $ref: '#/components/schemas/ErrorChunk'
        - $ref: '#/components/schemas/RunEvent'
