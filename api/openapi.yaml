        required: true
        schema: {type: string}
    delete:
      operationId: withdrawClarification
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationVersionRequest'
      responses:
        '200':
          description: Durable clarification receipt. Internal protocol checkpoints are never exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clarification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'


  /api/runs/{id}/continue:
