openapi: 3.1.0
info:
  title: AgentFlow API
  version: 0.1.0
  description: |
    Authoritative HTTP contract shared by generated Go DTOs and the typed
    TypeScript client. Business handlers remain implemented with net/http.
servers:
  - url: http://localhost:8080
tags:
  - name: System
  - name: Chat
  - name: Conversations
  - name: Agents
  - name: Runs
  - name: Tools

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      responses:
        '200':
          description: API process health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/conversations:
    get:
      operationId: listConversations
      tags: [Conversations]
      responses:
        '200':
          description: Conversations visible in the current workspace.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Created conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/conversations/{id}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    patch:
      operationId: updateConversation
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteConversation
      tags: [Conversations]
      responses:
        '200':
          description: Conversation deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/conversations/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listMessages
      tags: [Conversations]
      responses:
        '200':
          description: Conversation messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chat:
    post:
      operationId: streamChat
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-sent stream of ChatStreamEvent values.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agents:
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        '200':
          description: Active agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
      responses:
        '201':
          description: Created agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentId'
    get:
      operationId: getAgent
      tags: [Agents]
      responses:
        '200':
          description: Agent configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigRequest'
      responses:
        '200':
          description: Updated agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: archiveAgent
      tags: [Agents]
      responses:
        '204':
          description: Agent archived.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/runs:
    get:
      operationId: listRuns
      tags: [Runs]
      responses:
        '200':
          description: Runs ordered by the store.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Run'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      tags: [Runs]
      responses:
        '200':
          description: Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/continue:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: continueRun
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContinueRunRequest'
      responses:
        '200':
          description: Server-sent stream of ChatStreamEvent values.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: resumeRun
      tags: [Runs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeRunRequest'
      responses:
        '200':
          description: Server-sent stream of ChatStreamEvent values.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      tags: [Runs]
      responses:
        '200':
          description: Canceled or canceling run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/verify:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: verifyRun
      tags: [Runs]
      responses:
        '200':
          description: Verification decision and resulting Run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunReplay
      tags: [Runs]
      responses:
        '200':
          description: Replayable Run state and evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/usage:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunUsage
      tags: [Runs]
      responses:
        '200':
          description: Run budget and append-only usage ledger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunUsageLedger'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/collaboration_steps:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: listCollaborationSteps
      tags: [Runs]
      responses:
        '200':
          description: Multi-Agent or Autonomous stages for the Run.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollaborationStep'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tools:
    get:
      operationId: listTools
      tags: [Tools]
      responses:
        '200':
          description: Tool catalog and current enabled state.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tools/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    post:
      operationId: enableTool
      tags: [Tools]
      responses:
        '200':
          description: Updated tool catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tools/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    post:
      operationId: disableTool
      tags: [Tools]
      responses:
        '200':
          description: Updated tool catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ToolName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Run admission queue is full or temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        source:
          type: string
        category:
          type: string
        retryable:
          type: boolean
        operation:
          type: string
        request_id:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    ChatMode:
      type: string
      enum: [single, multi_agent, autonomous]
    RunStatus:
      type: string
      enum: [queued, running, waiting_for_user, completed, failed, failed_recoverable, canceling, canceled]
    VerificationStatus:
      type: string
      enum: [not_required, pending, running, passed, failed, blocked, stale]
    VerifierType:
      type: string
      enum: [command, http, json_schema, text_constraints, citation, answer_relevance, grounded_answer]

    VerifierSpecInput:
      type: object
      required: [id, type, required, config]
      properties:
        id:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/VerifierType'
        version:
          type: string
        required:
          type: boolean
        timeout_ms:
          type: integer
          format: int64
          minimum: 0
        config:
          type: object
          additionalProperties: true
    VerificationPolicyInput:
      type: object
      required: [mode, max_attempts, on_exhausted]
      properties:
        mode:
          type: string
          enum: [all_must_pass, any_may_pass]
        max_attempts:
          type: integer
          minimum: 1
        on_exhausted:
          type: string
          enum: [fail, waiting_for_user]
    CompletionContractInput:
      type: object
      required: [subject_type, verifiers, policy]
      properties:
        subject_type:
          type: string
          enum: [run_output]
        verifiers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VerifierSpecInput'
        policy:
          $ref: '#/components/schemas/VerificationPolicyInput'
    CompletionContract:
      allOf:
        - $ref: '#/components/schemas/CompletionContractInput'
        - type: object
          required: [id, version, hash]
          properties:
            id:
              type: string
            version:
              type: integer
            hash:
              type: string

    ChatRequest:
      type: object
      required: [message]
      properties:
        workspace_id:
          type: string
        conversation_id:
          type: string
        agent_id:
          type: string
        message:
          type: string
          minLength: 1
        mode:
          $ref: '#/components/schemas/ChatMode'
        completion_contract:
          $ref: '#/components/schemas/CompletionContractInput'
    ContinueRunRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
        routing_requirements:
          $ref: '#/components/schemas/AgentRoutingRequirements'
    AgentRoutingRequirements:
      type: object
      properties:
        required_tools:
          type: array
          items:
            type: string
        prohibited_tools:
          type: array
          items:
            type: string
        require_memory:
          type: boolean
        require_retrieval:
          type: boolean
        preferred_capabilities:
          type: array
          items:
            type: string
    ResumeRunRequest:
      type: object
      required: [user_input]
      properties:
        user_input:
          type: string

    CreateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
    UpdateConversationRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
    DeleteConversationResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean
    Conversation:
      type: object
      required: [id, workspace_id, title, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Message:
      type: object
      required: [id, workspace_id, conversation_id, role, content, created_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RAGCitation'
        created_at:
          type: string
          format: date-time

    RAGCitation:
      type: object
      required: [source_id, document_id, document_title, chunk_id]
      properties:
        source_id: { type: string }
        document_id: { type: string }
        document_title: { type: string }
        document_version: { type: string }
        chunk_id: { type: string }
        source_chunk_ids:
          type: array
          items: { type: string }
        section_path:
          type: array
          items: { type: string }
        start_offset: { type: integer }
        end_offset: { type: integer }

    AgentConfigRequest:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        routing_hints:
          $ref: '#/components/schemas/AgentRoutingHints'
        tools:
          type: array
          items:
            type: string
        memory_enabled:
          type: boolean
        retrieval_enabled:
          type: boolean
    Agent:
      type: object
      required: [id, name, description, system_prompt, tools, memory_enabled, retrieval_enabled, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        routing_hints:
          $ref: '#/components/schemas/AgentRoutingHints'
        tools:
          type: array
          items:
            type: string
        memory_enabled:
          type: boolean
        retrieval_enabled:
          type: boolean
        executor:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentRoutingHints:
      type: object
      required: [capabilities, task_examples, exclusions]
      properties:
        capabilities:
          type: array
          items:
            type: string
        task_examples:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string

    ToolInfo:
      type: object
      required: [name, description, parameters, enabled]
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        enabled:
          type: boolean

    Run:
      type: object
      required: [id, workspace_id, agent_id, conversation_id, status, verification_status, active_runtime_ms, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        agent_id:
          type: string
        conversation_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        completion_contract:
          $ref: '#/components/schemas/CompletionContract'
        error:
          type: string
        started_at:
          type: string
          format: date-time
        execution_started_at:
          type: string
          format: date-time
        active_runtime_ms:
          type: integer
          format: int64
        heartbeat_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollaborationStep:
      type: object
      required: [id, run_id, conversation_id, role, status, input, output, created_at, updated_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
        agent_id:
          type: string
        status:
          type: string
        iteration:
          type: integer
        input:
          type: string
        output:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunEvent:
      type: object
      required: [id, type, schema_version, sequence, run_id, payload, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        schema_version:
          type: integer
        sequence:
          type: integer
          format: int64
        conversation_id:
          type: string
        run_id:
          type: string
        stage_id:
          type: string
        turn_id:
          type: string
        parent_event_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    RunTraceSummary:
      type: object
      required: [run_id, status, total_duration_ms, total_tokens, prompt_tokens, completion_tokens, token_usage_estimated, llm_calls, tool_calls, error_count]
      properties:
        run_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        total_duration_ms:
          type: integer
          format: int64
        total_tokens:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        token_usage_estimated:
          type: boolean
        llm_calls:
          type: integer
        tool_calls:
          type: integer
        error_count:
          type: integer

    RuntimeRunBudget:
      type: object
      properties:
        max_model_calls: { type: integer }
        max_prompt_tokens: { type: integer }
        max_completion_tokens: { type: integer }
        max_total_tokens: { type: integer }
        max_tool_calls: { type: integer }
        max_runtime_ms: { type: integer, format: int64 }
        max_estimated_cost_micros: { type: integer, format: int64 }
        input_cost_per_million_tokens_micros: { type: integer, format: int64 }
        output_cost_per_million_tokens_micros: { type: integer, format: int64 }
    RunUsageTotals:
      type: object
      required: [model_calls, tool_calls, prompt_tokens, completion_tokens, total_tokens, estimated_cost_micros, open_reservations]
      properties:
        model_calls: { type: integer }
        tool_calls: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_micros: { type: integer, format: int64 }
        open_reservations: { type: integer }
    RunUsageEntry:
      type: object
      required: [id, run_id, operation_id, kind, purpose, timestamp]
      properties:
        id: { type: string }
        run_id: { type: string }
        operation_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        kind:
          type: string
          enum: [model.reservation, model.settlement, tool.execution]
        purpose:
          type: string
          enum: [primary, router, compaction]
        model: { type: string }
        tool_name: { type: string }
        model_calls: { type: integer }
        tool_calls: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_micros: { type: integer, format: int64 }
        estimated: { type: boolean }
        timestamp: { type: string, format: date-time }
    RunUsageLedger:
      type: object
      required: [run_id, budget, totals, entries]
      properties:
        run_id: { type: string }
        budget:
          $ref: '#/components/schemas/RuntimeRunBudget'
        totals:
          $ref: '#/components/schemas/RunUsageTotals'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/RunUsageEntry'
        updated_at:
          type: string
          format: date-time

    VerificationEvidence:
      type: object
      additionalProperties: true
      required: [id, run_id, verifier_id, status]
      properties:
        id: { type: string }
        run_id: { type: string }
        verifier_id: { type: string }
        status:
          $ref: '#/components/schemas/VerificationStatus'
    VerificationArtifact:
      type: object
      additionalProperties: true
      required: [id, run_id, evidence_id, kind]
      properties:
        id: { type: string }
        run_id: { type: string }
        evidence_id: { type: string }
        kind: { type: string }
    RunReplay:
      type: object
      required: [run, projection, conversation, messages, steps, summary, usage_ledger, run_events, stage_checkpoints, tool_effects, tool_artifacts, verification_evidence, verification_artifacts, task_state_revisions, child_delegations]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        projection:
          type: object
          additionalProperties: true
        runtime_snapshot:
          type: object
          additionalProperties: true
        conversation:
          $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/CollaborationStep'
        summary:
          $ref: '#/components/schemas/RunTraceSummary'
        usage_ledger:
          $ref: '#/components/schemas/RunUsageLedger'
        run_events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
        stage_checkpoints:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_effects:
          type: array
          items:
            type: object
            additionalProperties: true
        tool_artifacts:
          type: array
          items:
            type: object
            additionalProperties: true
        verification_evidence:
          type: array
          items:
            $ref: '#/components/schemas/VerificationEvidence'
        verification_artifacts:
          type: array
          items:
            $ref: '#/components/schemas/VerificationArtifact'
        task_state_revisions:
          type: array
          items:
            type: object
            additionalProperties: true
        parent_delegation:
          type: object
          additionalProperties: true
        child_delegations:
          type: array
          items:
            type: object
            additionalProperties: true
        recovery_summary:
          type: object
          additionalProperties: true
    VerificationDecision:
      type: object
      required: [status, allow_completion, attempt, subject_hash, run_status, summary]
      properties:
        status:
          $ref: '#/components/schemas/VerificationStatus'
        allow_completion: { type: boolean }
        attempt: { type: integer }
        subject_hash: { type: string }
        run_status:
          $ref: '#/components/schemas/RunStatus'
        summary: { type: string }
    VerifyRunResponse:
      type: object
      required: [run, decision]
      properties:
        run:
          $ref: '#/components/schemas/Run'
        decision:
          $ref: '#/components/schemas/VerificationDecision'

    ConversationChunk:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: conversation
        conversation_id: { type: string }
    RunStateChunk:
      type: object
      required: [type, conversation_id, run_id, agent_id, status]
      properties:
        type:
          type: string
          const: run_state
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        status:
          $ref: '#/components/schemas/RunStatus'
    RunProgressChunk:
      type: object
      required: [type, conversation_id, run_id]
      properties:
        type:
          type: string
          const: run_progress
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        iteration: { type: integer }
        max_iterations: { type: integer }
        elapsed_seconds: { type: integer }
        max_runtime_seconds: { type: integer }
        output_chars: { type: integer }
        max_output_chars: { type: integer }
        tool_calls: { type: integer }
        max_tool_calls: { type: integer }
        stop_reason: { type: string }
    ModelDeltaChunk:
      type: object
      required: [type, delta]
      properties:
        type:
          type: string
          const: model_delta
        delta: { type: string }
    StageStateChunk:
      type: object
      required: [type, conversation_id, run_id, role, status]
      properties:
        type:
          type: string
          const: stage_state
        conversation_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        role: { type: string }
        status: { type: string }
        iteration: { type: integer }
        input: { type: string }
        output: { type: string }
        error: { type: string }
    DoneChunk:
      type: object
      required: [type, conversation_id]
      properties:
        type:
          type: string
          const: done
        conversation_id: { type: string }
        title: { type: string }
        message_id: { type: string }
        run_id: { type: string }
        agent_id: { type: string }
        status:
          $ref: '#/components/schemas/RunStatus'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        citations:
          type: array
          items:
            $ref: '#/components/schemas/RAGCitation'
        invalid_citation_ids:
          type: array
          items: { type: string }
    ErrorChunk:
      type: object
      required: [type, error]
      properties:
        type:
          type: string
          const: error
        error: { type: string }
        code: { type: string }
        source: { type: string }
        category: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
    ChatStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/ConversationChunk'
        - $ref: '#/components/schemas/RunStateChunk'
        - $ref: '#/components/schemas/RunProgressChunk'
        - $ref: '#/components/schemas/ModelDeltaChunk'
        - $ref: '#/components/schemas/StageStateChunk'
        - $ref: '#/components/schemas/DoneChunk'
        - $ref: '#/components/schemas/ErrorChunk'
        - $ref: '#/components/schemas/RunEvent'
