        type: { type: string, enum: [set_goal, clear_goal, upsert_task, set_task_status, remove_task, add_decision, upsert_constraint, remove_constraint, upsert_blocker, resolve_blocker, remove_blocker, add_artifact_ref, remove_artifact_ref] }
        goal: { type: string }
        task: { $ref: '#/components/schemas/TaskItem' }
        task_id: { type: string }
        task_status: { $ref: '#/components/schemas/TaskItemStatus' }
        decision: { $ref: '#/components/schemas/TaskDecision' }
        constraint: { $ref: '#/components/schemas/TaskConstraint' }
        constraint_id: { type: string }
        blocker: { $ref: '#/components/schemas/TaskBlocker' }
        blocker_id: { type: string }
        artifact_ref: { type: string }
    TaskStatePatch:
      type: object
      additionalProperties: false
      required: [expected_version, operations]
      properties:
        expected_version: { type: integer, format: int64, minimum: 0 }
        operations: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/TaskStateOperation' } }
    TaskStateSource:
      type: object
      required: [actor_type]
      properties:
        actor_type: { type: string }
        actor_id: { type: string }
        run_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        source_message_id: { type: string }
    TaskStateRevision:
      type: object
      required: [id, workspace_id, conversation_id, version, previous_version, patch, state, source, created_at]
      properties:
        id: { type: string }
        workspace_id: { type: string }
        conversation_id: { type: string }
        version: { type: integer, format: int64 }
        previous_version: { type: integer, format: int64 }
        patch: { $ref: '#/components/schemas/TaskStatePatch' }
        state: { $ref: '#/components/schemas/TaskState' }
        source: { $ref: '#/components/schemas/TaskStateSource' }
        created_at: { type: string, format: date-time }
