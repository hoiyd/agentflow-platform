      responses:
        '200':
          description: Multi-Agent or Autonomous stages for the Run.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CollaborationStep'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tools:
    get:
      operationId: listTools
      tags: [Tools]
      description: Service-owned Tool catalog with the selected Workspace's persisted grants and effective availability.
      responses:
        '200':
          description: Tool catalog, Workspace configuration revision and exclusion reasons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tools/{name}/enable:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    post:
      operationId: enableTool
      tags: [Tools]
      description: Allow an installed, service-ready Tool in the selected Workspace. Does not modify operator configuration or Agent selection.
      responses:
        '200':
          description: Updated tool catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/tools/{name}/disable:
    parameters:
      - $ref: '#/components/parameters/ToolName'
    post:
      operationId: disableTool
      tags: [Tools]
      description: Revoke the selected Workspace's Tool grant. Subsequent execution and recovery callbacks recheck the grant.
      responses:
        '200':
          description: Updated tool catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ToolInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/mcp/connections:
    get:
      operationId: listMCPConnections
      tags: [Tools]
      description: List only the selected Workspace's remote MCP connections. Never returns credentials.
      responses:
        '200':
          description: Workspace connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MCPConnection'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMCPConnection
      tags: [Tools]
      description: Save a Workspace-owned Streamable HTTP connection. Discovery and tool authorization are separate commands.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPConnectionRequest'
      responses:
        '201':
          description: Saved connection; no secret values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/mcp/connections/{id}:
    parameters:
      - $ref: '#/components/parameters/MCPConnectionId'
    get:
      operationId: getMCPConnection
      tags: [Tools]
      responses:
        '200':
          description: Owned connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnection'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateMCPConnection
      tags: [Tools]
      description: Update with the last observed revision. Omission preserves a Bearer token; switching authentication to none erases it. URL or credential changes invalidate discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPConnectionRequest'
      responses:
        '200':
          description: Saved connection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteMCPConnection
      tags: [Tools]
      description: Soft-delete connection and erase its stored credential; preserve historical Run evidence.
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /api/mcp/connections/{id}/test:
    parameters:
      - $ref: '#/components/parameters/MCPConnectionId'
    post:
      operationId: testMCPConnection
      tags: [Tools]
      description: Bounded connection and schema discovery; returns status, not tool grants. Failed tests withdraw readiness. Concurrent edits reject stale results.
      responses:
        '200':
          description: Discovery result, including stable authentication or connection failure status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnection'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  parameters:
    MCPConnectionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,18}$'
    ConversationId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AgentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ToolName:
      name: name
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  responses:
    ServiceUnavailable:
      description: Required service or credential configuration is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Run admission queue is full or temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MCPConnectionRequest:
      type: object
      additionalProperties: false
      required: [name, url, auth_mode, enabled, read_only_tools]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        url:
          type: string
          maxLength: 2048
        auth_mode:
          type: string
          enum: [none, bearer]
        bearer_token:
          type: string
          writeOnly: true
          maxLength: 8192
          description: Omit to retain a Bearer token; switching auth_mode to none erases it. Empty is valid only with none. Never returned or captured.
        enabled:
          type: boolean
        read_only_tools:
          type: array
          maxItems: 64
          items:
            type: string
        revision:
          type: integer
          format: int64
          description: Required for updates; optimistic concurrency, not a protocol version.
    MCPConnection:
      type: object
      required: [id, workspace_id, name, url, auth_mode, enabled, read_only_tools, revision, status, credential_configured, tools, created_at, updated_at]
      properties:
        id:
          type: string
          description: BIGINT primary key serialized as a decimal string.
        workspace_id:
          type: string
        name:
          type: string
        url:
          type: string
        auth_mode:
          type: string
          enum: [none, bearer]
        enabled:
          type: boolean
        read_only_tools:
          type: array
          items:
            type: string
        revision:
          type: integer
          format: int64
        status:
          type: string
          description: configured, discovered, or stable MCP discovery failure reason; enabled is independent.
        credential_configured:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPDiscoveredTool'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MCPDiscoveredTool:
      type: object
      required: [name, binding_name, description, supported]
      properties:
        name:
          type: string
        binding_name:
          type: string
        description:
          type: string
        supported:
          type: boolean
        reason:
          type: string
    RAGGoldenSource:
      type: object
      additionalProperties: false
      description: Source matchers are ANDed; at least one matcher is required.
      properties:
        document_id: { type: string }
        chunk_id: { type: string }
        source_uri: { type: string }
        content_contains: { type: array, items: { type: string } }
    RAGEvaluationCase:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        id: { type: string }
        query: { type: string }
        answerable: { type: boolean }
        expected_sources: { type: array, items: { $ref: '#/components/schemas/RAGGoldenSource' } }
        forbidden_sources: { type: array, items: { $ref: '#/components/schemas/RAGGoldenSource' } }
        required_source_count: { type: integer }
        expected_document_ids: { type: array, items: { type: string } }
        expected_chunk_ids: { type: array, items: { type: string } }
        expected_chunk_contains: { type: array, items: { type: string } }
        min_acceptable_rank: { type: integer }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        metadata_filter: { $ref: '#/components/schemas/MetadataFilter' }
        require_filter: { type: boolean, description: Require a nonempty effective case or request restriction. Omission keeps legacy unfiltered behavior. }
    RAGGoldenDataset:
      type: object
      additionalProperties: false
      required: [schema_version, id, version, cases]
      description: Golden cases additionally require id, answerable and expected_sources for answerable cases. See the published Golden JSON Schema.
      properties:
        schema_version: { type: string, enum: [rag-golden-dataset-v1] }
        id: { type: string }
        version: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        cases: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/RAGEvaluationCase' } }
    RAGEvaluationRunRequest:
      type: object
      additionalProperties: false
      description: Provide dataset OR cases, not both. Request restrictions are mandatory AND constraints outside case OR expressions; Workspace is resolved by authorization, not by dataset contents.
      properties:
        dataset: { $ref: '#/components/schemas/RAGGoldenDataset' }
        cases: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/RAGEvaluationCase' } }
        workspace_id: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        metadata_filter: { $ref: '#/components/schemas/MetadataFilter' }
        top_k: { type: integer }
        min_similarity: { type: number }
    RAGEvaluationEvidence:
      type: object
      required: [schema_version, scope_policy, lifecycle_policy, workspace_id, observed_at, expected_sources, matched_sources, context_matched_sources, context_leak_count, context_tokens, latency_ms, context_sources]
      properties:
        metadata: { type: object, additionalProperties: { type: string } }
        metadata_filter: { $ref: '#/components/schemas/MetadataFilter' }
        schema_version: { type: string }
        scope_policy: { type: string }
        lifecycle_policy: { type: string }
        workspace_id: { type: string }
        observed_at: { type: string, format: date-time }
        expected_sources: { type: integer }
        matched_sources: { type: integer }
        context_matched_sources: { type: integer }
        context_leak_count: { type: integer }
        context_tokens: { type: integer, description: Local selected-Context token estimate, not billed generation usage. }
        context_selection: { type: object, additionalProperties: true, description: Selection and transformation identity, budget and actual expansion counts. }
        latency_ms: { type: integer, format: int64 }
        context_sources:
          type: array
          items:
            type: object
            required: [document_id, updated_at, chunk_hash]
            properties:
              document_id: { type: string }
              source_uri: { type: string }
              document_version: { type: string }
              metadata_schema_version: { type: string }
              updated_at: { type: string, format: date-time }
              chunk_hash: { type: string }
              source_chunk_ids: { type: array, items: { type: string } }
    KnowledgeSearchRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query: { type: string }
        workspace_id: { type: string }
        metadata: { type: object, additionalProperties: { type: string }, description: Legacy exact-text equality; ANDed with metadata_filter. }
        metadata_filter: { $ref: '#/components/schemas/MetadataFilter' }
        limit: { type: integer }
        min_similarity: { type: number }
        knowledge_context_max_tokens: { type: integer }
    MetadataFilter:
      type: object
      additionalProperties: false
      required: [schema_version, where]
      description: Opt-in typed eligibility, at most 16 KiB. Only documents validated under this version participate; legacy/unknown versions are excluded. Null is rejected rather than treated as omission.
      properties:
        schema_version: { type: string, enum: [knowledge-metadata-v1] }
        where: { $ref: '#/components/schemas/MetadataCondition' }
    KnowledgeScope:
      type: object
      required: [filter, id, policy_version, source]
      description: Frozen business restriction, not a permission grant. Identity hashes normalized filter JSON; old Runs without this field remain unfiltered.
      properties:
        filter: { $ref: '#/components/schemas/MetadataFilter' }
        id: { type: string }
        policy_version: { type: string, enum: [knowledge-filter-v1] }
        source: { type: string, enum: [run_request] }
    MetadataCondition:
      type: object
      additionalProperties: false
      description: Exactly one nonempty all/any group OR a field/op/value leaf. At most 4 levels and 32 nodes, including groups. Missing/null fields never match; no NOT or implicit coercion. eq/in support scalars, contains/in support string-array membership, and ranges support numbers/dates only. in accepts 1-32 typed values; array in means any member overlaps. Both metadata layers are explicitly addressed, never ORed implicitly.
      properties:
        all:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/MetadataCondition' }
        any:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/MetadataCondition' }
        field:
          type: string
          enum: [document.metadata.product, document.metadata.environment, document.metadata.language, document.metadata.tags, document.metadata.priority, document.metadata.is_reference, document.metadata.published_at, chunk.metadata.product, chunk.metadata.environment, chunk.metadata.language, chunk.metadata.tags, chunk.metadata.priority, chunk.metadata.is_reference, chunk.metadata.published_at]
        op: { type: string, enum: [eq, in, contains, lt, lte, gt, gte] }
        value:
          description: A field-typed scalar, or array for in. Date-times require explicit timezone, microsecond precision and UTC years 0001-9999; numbers retain exact decimal semantics. Field bounds are defined by the selected metadata schema.
    DocumentIngestRequest:
      type: object
      required: [title, content]
      properties:
        workspace_id: { type: string }
        source_key: { type: string }
        title: { type: string }
        version: { type: string }
        content: { type: string }
        source_type: { type: string }
        source_uri: { type: string }
        mime_type: { type: string }
        metadata: { type: object, additionalProperties: true }
        metadata_schema_version: { type: string, description: Opt into knowledge-metadata-v1. Omission retains an existing source's version or creates legacy metadata for a new source. }
        lifecycle: { $ref: '#/components/schemas/DocumentLifecycle' }
        expected_updated_at: { type: string, format: date-time }
    DocumentMetadataUpdate:
      type: object
      additionalProperties: false
      required: [expected_updated_at, metadata]
      properties:
        expected_updated_at: { type: string, format: date-time, description: Nonzero microsecond-precision timestamp from Document.updated_at. }
        metadata: { type: object, additionalProperties: true, description: Custom field replacement. Derived fields are preserved; conflicting provided values are rejected. }
        metadata_schema_version: { type: string, description: Explicit knowledge-metadata-v1 adoption; omission retains the stored version. Known fields are validated and dates normalized to UTC. }
        lifecycle: { $ref: '#/components/schemas/DocumentLifecycle', description: Omission preserves lifecycle; an empty object resets active/unbounded. Uses the same optimistic concurrency token as metadata. }
    DocumentLifecycle:
      type: object
      additionalProperties: false
      description: Document-owned hard eligibility, independent of metadata labels. Missing status means active. UTC validity is [valid_from, valid_until); missing bounds are unlimited. Publication time is informational, not permission or a retrieval gate. Timestamps require explicit timezone, microsecond precision and UTC years 0001-9999.
      properties:
        status: { type: string, enum: [active, draft, withdrawn], default: active }
        valid_from: { type: string, format: date-time, x-go-type: string }
        valid_until: { type: string, format: date-time, x-go-type: string }
        published_at: { type: string, format: date-time, x-go-type: string }
    DocumentMetadataSchema:
      type: object
      required: [version, fields, extension_policy, typed_filtering, runtime_filtering]
      properties:
        version: { type: string }
        extension_policy: { type: string, enum: [preserve_unverified] }
        typed_filtering: { type: boolean, description: Whether the server supports the separate bounded metadata_filter request contract. }
        runtime_filtering: { type: boolean, description: Whether Chat freezes knowledge_filter and enforces it in automatic retrieval, Tools and citation rereads. Clients must not send a constrained Run to an older server without this capability. }
        fields:
          type: array
          items: { $ref: '#/components/schemas/DocumentMetadataField' }
    DocumentMetadataField:
      type: object
      required: [key, type, owner, scope, nullable]
      properties:
        key: { type: string }
        type: { type: string, enum: [string, enum, string-array, number, bool, date-time, derived] }
        owner: { type: string, enum: [owner_declared, system_derived] }
        scope: { type: string, enum: [document, chunk, both] }
        nullable: { type: boolean }
        max_length: { type: integer }
        max_items: { type: integer }
        values: { type: array, items: { type: string } }
        minimum: { type: number }
        maximum: { type: number }
    KnowledgeDocumentDetail:
      type: object
      required: [document, chunks, metadata_schema]
      properties:
