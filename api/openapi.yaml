        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: patchTaskState
      tags: [Conversations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskStatePatch' }
      responses:
        '200':
          description: Immutable applied revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStateRevision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/runs/{id}/projection:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunProjection
      tags: [Runs]
      responses:
        '200':
          description: Event-derived read models and runtime diagnostics at an event watermark.
