        $ref: '#/components/schemas/SkillInvocationPolicy'
    SkillToolDependency:
      type: object
      required: [name, ready, agent_binding_required]
      properties:
        name: { type: string }
        ready: { type: boolean }
        reason: { type: string }
        agent_binding_required: { type: boolean }
    SkillMetadata:
      type: object
      required: [name, description, hash]
      properties:
        name: { type: string }
        description: { type: string }
        hash: { type: string }
        required_tools:
          type: array
          items: { type: string }
        invocation_policy:
          $ref: '#/components/schemas/SkillInvocationPolicy'
        tool_dependencies:
          type: array
          description: Current Workspace readiness only, not per-call execution authorization.
          items:
            $ref: '#/components/schemas/SkillToolDependency'

    AgentRoutingHints:
      type: object
      required: [capabilities, task_examples, exclusions]
      properties:
        capabilities:
          type: array
          items:
            type: string
        task_examples:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string

    ToolSource:
      type: object
      description: Reviewed remote Tool identity. Contains no endpoint credentials or live connection state.
      required: [kind, server_id, remote_name, transport]
      properties:
        kind: { type: string, enum: [mcp] }
        server_id: { type: string }
        remote_name: { type: string }
        transport: { type: string, enum: [streamable_http] }
        definition_hash: { type: string }

    ToolInfo:
      type: object
      required: [name, description, parameters, enabled]
      properties:
        service_enabled:
          type: boolean
          description: Operator-owned service switch. Workspace owners cannot override it.
        source: { $ref: '#/components/schemas/ToolSource' }
        workspace_enabled:
          type: boolean
          description: Persisted Workspace allowlist entry, independent of service readiness.
        config_revision:
          type: integer
          format: int64
        excluded_reason:
          type: string
          description: Service, prerequisite, Workspace or static-policy exclusion reason; argument-dependent decisions remain in Run events.
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          additionalProperties: true
        enabled:
          type: boolean
        unavailable_reason:
          type: string
          description: Runtime prerequisite that prevents an enabled Tool from being offered to the model.

    Run:
      type: object
      required: [id, workspace_id, agent_id, conversation_id, status, verification_status, active_runtime_ms, created_at, updated_at]
      properties:
        knowledge_scope: { $ref: '#/components/schemas/KnowledgeScope' }
        execution_constraint:
          type: string
          readOnly: true
          description: Derived from the frozen Snapshot; omission means ordinary execution.
        id:
          type: string
        workspace_id:
          type: string
        agent_id:
          type: string
        conversation_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        verification_status:
          $ref: '#/components/schemas/VerificationStatus'
        completion_contract:
          $ref: '#/components/schemas/CompletionContract'
        error:
          type: string
        started_at:
          type: string
          format: date-time
        execution_started_at:
          type: string
          format: date-time
        active_runtime_ms:
          type: integer
          format: int64
        heartbeat_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OperatorAttentionEvidence:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string }
        id: { type: string }
        status: { type: string }
        summary: { type: string }
        artifact_refs:
          type: array
          items: { type: string }
    OperatorAttentionAction:
      type: object
      required: [kind, label, enabled]
      properties:
        kind: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        target_id: { type: string }
        unavailable_reason: { type: string }
    OperatorAttentionItem:
      type: object
      required: [run_id, conversation_id, conversation_title, run_status, reason, title, message, evidence, observation_sequence, updated_at]
      properties:
        run_id: { type: string }
        conversation_id: { type: string }
        conversation_title: { type: string }
        run_status:
          $ref: '#/components/schemas/RunStatus'
        reason:
          type: string
          enum: [reconciliation_required, recovery_available, waiting_for_user, verification_attention, budget_exhausted, failure]
        title: { type: string }
        message: { type: string }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/OperatorAttentionEvidence'
        recommended_action:
          $ref: '#/components/schemas/OperatorAttentionAction'
        observation_sequence:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    CollaborationStep:
      type: object
      required: [id, run_id, conversation_id, role, status, input, output, created_at, updated_at]
      properties:
        id:
          type: string
        run_id:
          type: string
        conversation_id:
          type: string
        role:
          type: string
        agent_id:
          type: string
        status:
          type: string
        iteration:
          type: integer
        input:
          type: string
        output:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RunEvent:
      type: object
      required: [id, type, schema_version, sequence, run_id, payload, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        schema_version:
          type: integer
        sequence:
          type: integer
          format: int64
        conversation_id:
          type: string
        run_id:
          type: string
        stage_id:
          type: string
        turn_id:
          type: string
        parent_event_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        timestamp:
          type: string
          format: date-time
    RunTraceSummary:
      type: object
      required: [run_id, status, total_duration_ms, total_tokens, prompt_tokens, completion_tokens, token_usage_estimated, llm_calls, tool_calls, error_count]
      properties:
        run_id:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        total_duration_ms:
          type: integer
          format: int64
        total_tokens:
          type: integer
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        token_usage_estimated:
          type: boolean
        llm_calls:
          type: integer
        tool_calls:
          type: integer
        error_count:
          type: integer

    RuntimeRunBudget:
      type: object
      properties:
        max_model_calls: { type: integer }
        max_prompt_tokens: { type: integer }
        max_completion_tokens: { type: integer }
        max_total_tokens: { type: integer }
        max_tool_calls: { type: integer }
        max_runtime_ms: { type: integer, format: int64 }
        max_estimated_cost_micros: { type: integer, format: int64 }
        input_cost_per_million_tokens_micros: { type: integer, format: int64 }
        output_cost_per_million_tokens_micros: { type: integer, format: int64 }
    RunUsageTotals:
      type: object
      required: [model_calls, tool_calls, prompt_tokens, completion_tokens, total_tokens, estimated_cost_micros, open_reservations]
      properties:
        model_calls: { type: integer }
        tool_calls: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_micros: { type: integer, format: int64 }
        open_reservations: { type: integer }
        cost_unknown_entries: { type: integer, minimum: 0 }
    UsageBreakdown:
      type: object
      required: [source]
      description: Optional provider-reported subsets, already included in prompt/completion totals. Absent is unknown, not zero.
      properties:
        cached_input_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }
        source: { type: string, enum: [openai_details, deepseek_cache, invalid_details] }
    UsagePricing:
      type: object
      required: [source, input_per_million_tokens_micros, output_per_million_tokens_micros]
      properties:
        source: { type: string }
        input_per_million_tokens_micros: { type: integer, format: int64, minimum: 0 }
        output_per_million_tokens_micros: { type: integer, format: int64, minimum: 0 }
        cached_input_per_million_tokens_micros: { type: integer, format: int64, minimum: 0 }
    UsageCostDetails:
      type: object
      required: [status, reason, pricing, cache_discount_applied]
      description: Frozen quote and settlement assumptions; an estimate, not a provider invoice.
      properties:
        status: { type: string, enum: [estimated, unknown] }
        reason: { type: string }
        pricing: { $ref: '#/components/schemas/UsagePricing' }
        cache_discount_applied: { type: boolean }
    RunUsageEntry:
      type: object
      required: [id, run_id, operation_id, kind, purpose, timestamp]
      properties:
        id: { type: string }
        run_id: { type: string }
        operation_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        kind:
          type: string
          enum: [model.reservation, model.settlement, tool.execution]
        purpose:
          type: string
          enum: [primary, router, compaction]
        model: { type: string }
        tool_name: { type: string }
        model_calls: { type: integer }
        tool_calls: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_micros: { type: integer, format: int64 }
        estimated: { type: boolean }
        breakdown: { $ref: '#/components/schemas/UsageBreakdown' }
        cost_details: { $ref: '#/components/schemas/UsageCostDetails' }
        timestamp: { type: string, format: date-time }
    RunUsageLedger:
      type: object
      required: [run_id, budget, totals, entries]
      properties:
        run_id: { type: string }
        budget:
          $ref: '#/components/schemas/RuntimeRunBudget'
        totals:
          $ref: '#/components/schemas/RunUsageTotals'
        entries:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/RunUsageEntry'
        updated_at:
          type: string
          format: date-time

    VerificationEvidence:
      type: object
      additionalProperties: true
      required: [id, run_id, verifier_id, status]
      properties:
        id: { type: string }
        run_id: { type: string }
        verifier_id: { type: string }
        status:
          $ref: '#/components/schemas/VerificationStatus'
    VerificationArtifact:
      type: object
      additionalProperties: true
      required: [id, run_id, evidence_id, kind]
      properties:
        id: { type: string }
        run_id: { type: string }
        evidence_id: { type: string }
        kind: { type: string }
    SkillResourceEvidence:
      type: object
      required: [path, hash, offset, next_offset, total_bytes, event_id, sequence]
      properties:
        path: { type: string }
        hash: { type: string }
        offset: { type: integer }
        next_offset: { type: integer }
        total_bytes: { type: integer }
        event_id: { type: string }
        sequence: { type: integer, format: int64 }
    SkillFailureEvidence:
      type: object
      required: [tool, code, event_id, sequence]
      properties:
        tool: { type: string }
        code: { type: string }
        path: { type: string }
        event_id: { type: string }
        sequence: { type: integer, format: int64 }
    SkillEvidence:
      type: object
      required: [name, hash, agent_id, bound, instructions, activation, resources, failures]
      properties:
        name: { type: string }
        hash: { type: string }
        agent_id: { type: string }
        stage_id: { type: string }
        bound: { type: boolean }
        instructions: { type: string, enum: [included, not_observed] }
        activation: { type: string, enum: [explicit, model, not_observed] }
        first_sequence: { type: integer, format: int64 }
        first_request_sequence: { type: integer, format: int64 }
        manifest_id: { type: string }
        event_id: { type: string }
        request_id: { type: string }
        estimated_tokens: { type: integer }
        resources:
          type: array
          items: { $ref: '#/components/schemas/SkillResourceEvidence' }
        failures:
          type: array
          items: { $ref: '#/components/schemas/SkillFailureEvidence' }
    PartialOutput:
      description: Bounded display replacement committed at an event sequence; never model continuation or a final Message.
      type: object
      required: [run_id, turn_id, channel, round, revision, offset, text, status, sequence]
      properties:
        run_id: { type: string }
        stage_id: { type: string }
        turn_id: { type: string }
        model_call_id: { type: string }
        attempt: { type: integer, minimum: 0 }
        round: { type: integer, minimum: 1 }
        channel: { type: string, enum: [answer, reasoning] }
        role: { type: string }
        revision: { type: integer, format: int64, minimum: 1 }
        offset: { type: integer, minimum: 0, description: UTF-8 byte length of this display replacement, not provider stream offset. }
        text: { type: string }
        status: { type: string, enum: [provisional, retracted, final, interrupted] }
        truncated: { type: boolean }
        sequence: { type: integer, format: int64, minimum: 0 }
    ToolProgressUpdate:
      description: Bounded semantic progress only; counts do not imply Tool completion.
      type: object
      required: [phase]
      properties:
        phase: { type: string, pattern: '^[a-z0-9_-]{1,64}$' }
        message: { type: string, maxLength: 1024, description: Backend enforces a 1024 UTF-8 byte cap after redaction. }
        completed: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 1 }
        truncated: { type: boolean }
    ToolProgress:
      allOf:
        - $ref: '#/components/schemas/ToolProgressUpdate'
        - type: object
          required: [run_id, turn_id, tool_call_id, tool_name, status, sequence]
          properties:
            run_id: { type: string }
            turn_id: { type: string }
            stage_id: { type: string }
            tool_call_id: { type: string }
            tool_name: { type: string }
            status: { type: string, enum: [running, completed, failed, interrupted] }
            sequence: { type: integer, format: int64 }
    ToolProgressChunk:
      type: object
      required: [type, run_id, turn_id, tool_call_id, tool_name, status, sequence]
      properties:
        type: { type: string, const: tool_progress }
        run_id: { type: string }
        turn_id: { type: string }
        stage_id: { type: string }
        tool_call_id: { type: string }
        tool_name: { type: string }
        status: { type: string, enum: [running, completed, failed, interrupted] }
        sequence: { type: integer, format: int64 }
        update: { $ref: '#/components/schemas/ToolProgressUpdate' }
    RuntimeInvariantFailure:
      type: object
      required: [code, owner, run_id, message]
      properties:
        code: { type: string }
        owner: { type: string }
        run_id: { type: string }
        event_id: { type: string }
        sequence: { type: integer, format: int64 }
        message: { type: string }
    RunProjection:
      type: object
      required: [run_id, conversation_id, status, verification_status, active_stage_ids, active_turn_ids, active_model_call_ids, active_tool_call_ids, summary, as_of_sequence]
      properties:
        run_id: { type: string }
        conversation_id: { type: string }
        status: { type: string, description: Durable status; read views tolerate historical values. }
        verification_status: { type: string }
        active_stage_ids: { type: [array, 'null'], items: { type: string } }
        active_turn_ids: { type: [array, 'null'], items: { type: string } }
        active_model_call_ids: { type: [array, 'null'], items: { type: string } }
        active_tool_call_ids: { type: [array, 'null'], items: { type: string } }
        summary: { $ref: '#/components/schemas/RunTraceSummary' }
        as_of_sequence: { type: integer, format: int64 }
    UsageProjection:
      type: object
      required: [ledger, as_of_sequence]
      properties:
        ledger: { $ref: '#/components/schemas/RunUsageLedger' }
        as_of_sequence: { type: integer, format: int64 }
    VerificationProjection:
      type: object
      required: [status, latest_attempt, evidence_count, fresh_evidence_count, as_of_sequence]
      properties:
        status: { type: string }
        latest_attempt: { type: integer }
        current_subject_hash: { type: string }
        evidence_count: { type: integer }
        fresh_evidence_count: { type: integer }
        as_of_sequence: { type: integer, format: int64 }
    RunProjectionSnapshot:
      type: object
      required: [run, usage, verification, as_of_sequence, invariant_failures, tool_progress, partial_outputs]
      properties:
        run: { $ref: '#/components/schemas/RunProjection' }
        usage: { $ref: '#/components/schemas/UsageProjection' }
        verification: { $ref: '#/components/schemas/VerificationProjection' }
        as_of_sequence: { type: integer, format: int64 }
        invariant_failures: { type: [array, 'null'], items: { $ref: '#/components/schemas/RuntimeInvariantFailure' } }
        skill_evidence: { type: array, items: { $ref: '#/components/schemas/SkillEvidence' } }
        partial_outputs: { type: [array, 'null'], items: { $ref: '#/components/schemas/PartialOutput' } }
        tool_progress: { type: [array, 'null'], items: { $ref: '#/components/schemas/ToolProgress' } }
    RecoveryEvidence:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string }
        id: { type: string }
        status: { type: string }
        summary: { type: string }
        artifact_refs: { type: array, items: { type: string } }
    RecoveryAction:
      type: object
      required: [kind, label, enabled]
      properties:
        kind: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        target_id: { type: string }
        unavailable_reason: { type: string }
    RecoverySummary:
      type: object
      required: [reason, title, message, evidence, artifact_refs, actions]
      properties:
        reason: { type: string }
        title: { type: string }
        message: { type: string }
        evidence: { type: [array, 'null'], items: { $ref: '#/components/schemas/RecoveryEvidence' } }
        artifact_refs: { type: [array, 'null'], items: { type: string } }
        actions: { type: [array, 'null'], items: { $ref: '#/components/schemas/RecoveryAction' } }
    TaskItemStatus: { type: string, enum: [pending, in_progress, completed, canceled] }
    TaskBlockerStatus: { type: string, enum: [open, resolved] }
    TaskItem:
      type: object
      required: [id, title, status]
      properties:
        id: { type: string }
        title: { type: string }
        details: { type: string }
        status: { $ref: '#/components/schemas/TaskItemStatus' }
        artifact_refs: { type: array, items: { type: string } }
    TaskDecision:
      type: object
      required: [id, statement]
      properties:
        id: { type: string }
        statement: { type: string }
        rationale: { type: string }
        supersedes_id: { type: string }
    TaskConstraint:
      type: object
      required: [id, statement]
      properties:
        id: { type: string }
        statement: { type: string }
    TaskBlocker:
      type: object
      required: [id, description, status]
      properties:
        id: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/TaskBlockerStatus' }
    TaskState:
      type: object
      required: [schema_version, workspace_id, conversation_id, version, tasks, decisions, constraints, blockers, artifact_refs, updated_at]
      properties:
        schema_version: { type: integer }
        workspace_id: { type: string }
        conversation_id: { type: string }
        version: { type: integer, format: int64 }
        goal: { type: string }
        tasks: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        decisions: { type: array, items: { $ref: '#/components/schemas/TaskDecision' } }
        constraints: { type: array, items: { $ref: '#/components/schemas/TaskConstraint' } }
        blockers: { type: array, items: { $ref: '#/components/schemas/TaskBlocker' } }
        artifact_refs: { type: array, items: { type: string } }
        updated_at: { type: string, format: date-time }
    TaskStateOperation:
