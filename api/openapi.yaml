            application/json:
              schema:
                $ref: '#/components/schemas/VerifyRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunReplay
      tags: [Runs]
      responses:
        '200':
          description: Replayable Run state and evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunReplay'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/runs/{id}/result:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRunResult
      tags: [Runs]
      description: Return only the intact JSON object linked to passing verification evidence for a completed Run. Never returns provisional or unverified content.
      responses:
